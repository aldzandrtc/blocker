<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blocker — Gatekeeper</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0d0d0d;
    color: #e0e0e0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .container {
    max-width: 520px;
    width: 100%;
    padding: 40px 32px;
    text-align: center;
  }
  .icon { font-size: 48px; margin-bottom: 16px; }
  h1 { font-size: 24px; margin-bottom: 8px; color: #fff; }
  .subtitle { color: #888; margin-bottom: 24px; font-size: 14px; }
  .domain { color: #f87171; font-weight: 600; }
  textarea, input[type="text"] {
    width: 100%;
    padding: 12px;
    background: #1a1a1a;
    border: 1px solid #333;
    border-radius: 8px;
    color: #e0e0e0;
    font-size: 14px;
    resize: vertical;
  }
  textarea:focus, input:focus { outline: none; border-color: #6366f1; }
  textarea { min-height: 100px; }
  .btn {
    display: inline-block;
    padding: 10px 24px;
    border: none;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.2s;
  }
  .btn-primary { background: #6366f1; color: #fff; }
  .btn-primary:hover { background: #5558e6; }
  .btn-primary:disabled { background: #444; color: #888; cursor: not-allowed; }
  .btn-secondary { background: #333; color: #e0e0e0; margin-right: 12px; }
  .btn-secondary:hover { background: #444; }
  .btn-row { margin-top: 20px; }
  .result { padding: 16px; border-radius: 8px; margin-top: 16px; }
  .result.success { background: rgba(34,197,94,0.15); border: 1px solid rgba(34,197,94,0.3); }
  .result.fail { background: rgba(239,68,68,0.15); border: 1px solid rgba(239,68,68,0.3); }
  .spinner {
    display: inline-block;
    width: 24px; height: 24px;
    border: 3px solid #333;
    border-top-color: #6366f1;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  .problem-text {
    background: #1a1a1a;
    padding: 20px;
    border-radius: 8px;
    margin: 16px 0;
    text-align: left;
    font-size: 15px;
    line-height: 1.6;
  }
  .badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 16px;
    font-size: 12px;
    font-weight: 600;
  }
  .badge-strict { background: rgba(239,68,68,0.2); color: #f87171; }
  .badge-regular { background: rgba(99,102,241,0.2); color: #818cf8; }
  .katex { color: #e0e0e0; }
  .problem-text .katex-display { margin: 8px 0; }
</style>
</head>
<body>
<div class="container">
  <!-- Loading -->
  <div id="loading">
    <div class="spinner"></div>
    <p style="margin-top:16px;color:#888;">Preparing gatekeeper...</p>
  </div>

  <!-- Offline (macOS app not running) -->
  <div id="offline" class="hidden">
    <div class="icon">🔌</div>
    <h1>Blocker Unavailable</h1>
    <p class="subtitle">The Blocker macOS app is not running. Start it to unblock this site.</p>
  </div>

  <!-- Judge prompt -->
  <div id="judge-section" class="hidden">
    <div class="icon">⚖️</div>
    <h1>Convince the Judge</h1>
    <p class="subtitle">
      You tried to visit <span class="domain" id="judge-domain"></span>.
      <br>The default answer is <strong>DENY</strong>. Make your case:
    </p>
    <p style="margin-top:8px;font-size:13px;color:#888;" id="judge-timer" class="hidden"></p>
    <textarea id="argument" placeholder="Explain why you need access..."></textarea>
    <div class="btn-row">
      <button class="btn btn-primary" id="judge-submit" disabled>Submit Argument</button>
    </div>
    <div id="judge-result" class="hidden"></div>
  </div>

  <!-- Problem prompt -->
  <div id="problem-section" class="hidden">
    <div class="icon">🧮</div>
    <h1>Academic Problem</h1>
    <p class="subtitle">
      Solve this problem to access <span class="domain" id="problem-domain"></span>:
    </p>
    <div class="problem-text" id="problem-text"></div>
    <p style="color:#888;font-size:12px;margin-top:4px;" id="topic-label"></p>
    <input type="text" id="answer" placeholder="Your answer" autocomplete="off">
    <div class="btn-row">
      <button class="btn btn-primary" id="problem-submit" disabled>Submit Answer</button>
    </div>
    <div id="problem-result" class="hidden"></div>
  </div>

  <!-- Result shared -->
  <div id="result-section" class="hidden">
    <div class="icon" id="result-icon"></div>
    <h1 id="result-title"></h1>
    <div class="result" id="result-box"></div>
    <div class="btn-row">
      <button class="btn btn-primary" id="result-close">Close</button>
    </div>
  </div>
</div>
<script src="gatekeeper.js"></script>
</body>
</html>
