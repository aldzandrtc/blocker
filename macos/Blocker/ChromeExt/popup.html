<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blocker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    width: 300px;
    min-height: 200px;
    background: #0d0d0d;
    color: #e0e0e0;
    padding: 16px;
  }
  .header {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
  }
  .header h1 { font-size: 18px; color: #fff; }
  .status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-radius: 8px;
    margin-bottom: 12px;
    font-size: 13px;
  }
  .status.connected { background: rgba(34,197,94,0.15); color: #22c55e; }
  .status.disconnected { background: rgba(239,68,68,0.15); color: #ef4444; }
  .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
  }
  .dot.green { background: #22c55e; }
  .dot.red { background: #ef4444; }
  .section { margin-top: 12px; }
  .section h2 { font-size: 14px; color: #888; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.5px; }
  .item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 0;
    border-bottom: 1px solid #1a1a1a;
    font-size: 13px;
  }
  .item:last-child { border-bottom: none; }
  .tag {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 10px;
    font-weight: 600;
  }
  .tag.strict { background: rgba(239,68,68,0.2); color: #f87171; }
  .tag.regular { background: rgba(99,102,241,0.2); color: #818cf8; }
  .empty { color: #666; font-size: 13px; text-align: center; padding: 12px; }
  .footer { margin-top: 16px; font-size: 11px; color: #555; text-align: center; }
</style>
</head>
<body>
<div class="header">
  <span>🛡️</span>
  <h1>Blocker</h1>
</div>

<div class="status" id="status">
  <span class="dot" id="status-dot"></span>
  <span id="status-text">Checking...</span>
</div>

<div class="section">
  <h2>Blocked Sites</h2>
  <div id="blocklist">
    <p class="empty">Loading...</p>
  </div>
</div>

<div class="footer">Blocker v1.0</div>
<script src="popup.js"></script>
</body>
</html>
