<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Blocker</title>
<link rel="stylesheet" href="theme.css">
<style>
  body { width: 330px; padding: 0 16px 14px; }

  .masthead-bar {
    display: flex;
    align-items: baseline;
    gap: 10px;
    padding: 15px 0 9px;
  }
  .masthead-bar .masthead { font-size: 15px; }
  .masthead-bar .state { margin-left: auto; display: flex; align-items: center; gap: 6px; }
  .mark { width: 5px; height: 5px; flex: none; }
  .mark.on { background: var(--verdigris); }
  .mark.off { background: var(--seal); }

  .status-line {
    font-size: 12px;
    color: var(--muted);
    padding: 11px 0;
    line-height: 1.5;
  }
  .status-line b { font-family: var(--serif); font-weight: 600; color: var(--ink); }

  .granted-note {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--verdigris);
    padding-bottom: 11px;
  }

  section { padding-top: 14px; }

  .row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
  }
  .row .no {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--faint);
    flex: none;
  }
  .row .who { flex: 1; min-width: 0; }
  .row .name {
    font-size: 12.5px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .row .host {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--faint);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .none {
    font-family: var(--serif);
    font-size: 13px;
    color: var(--faint);
    padding: 22px 0;
    text-align: center;
  }

  .colophon {
    display: flex;
    justify-content: space-between;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--faint);
    padding-top: 13px;
    margin-top: 4px;
    border-top: 1px solid var(--rule-faint);
  }
</style>
</head>
<body>

<div class="masthead-bar">
  <span class="masthead">BLOCKER</span>
  <span class="state">
    <span class="clerk" id="status-word">…</span>
    <span class="mark" id="status-mark"></span>
  </span>
</div>
<div class="rule-heavy"></div>

<p class="status-line" id="status-line"></p>
<p class="granted-note hidden" id="granted-note"></p>

<section>
  <div class="section-rule">
    <span class="clerk">Under injunction</span>
    <span class="docket" id="count"></span>
  </div>
  <div id="blocklist">
    <p class="none">Loading…</p>
  </div>
</section>

<div class="colophon">
  <span>Blocker v1.0</span>
  <span id="sync-label"></span>
</div>

<script src="popup.js"></script>
</body>
</html>
